name: NovaCommerce CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
      SPRING_DATASOURCE_USERNAME: testuser
      SPRING_DATASOURCE_PASSWORD: testpass
      SPRING_PROFILES_ACTIVE: ci
      JWT_SECRET: NovaCommerceCISecretKeyForJWTTokenValidationMustBeLongHS512
      INTERNAL_API_KEY: nova-internal-service-key-2024

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configuración de Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cache de dependencias Maven
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 3.1 Esperar a que PostgreSQL esté listo
      - name: Wait for PostgreSQL readiness
        run: |
          echo "=== Esperando PostgreSQL en localhost:5432 ==="
          timeout 60 bash -c 'until echo > /dev/tcp/127.0.0.1/5432; do echo "PostgreSQL aún no está listo..."; sleep 2; done'
          echo "✓ PostgreSQL está listo"

      # 4. Verificar estructura del monorepo
      - name: Verify monorepo structure
        run: |
          echo "=== Microservicios encontrados ==="
          ls -la backend/
          echo ""
          echo "=== Verificando pom.xml en cada servicio ==="
          for service in backend/*/; do
            if [ -f "$service/pom.xml" ]; then
              echo "✓ $(basename $service)"
            else
              echo "✗ $(basename $service) - pom.xml NO ENCONTRADO"
            fi
          done

      # 5. Build de todos los microservicios con Maven
      - name: Build all microservices
        run: |
          echo "=== Iniciando compilación del monorepo ==="
          mvn clean compile \
            --file backend/pom.xml \
            -DskipTests \
            -B \
            -V

      # 6. Ejecución de tests unitarios con cobertura de código (JaCoCo)
      - name: Run tests and generate JaCoCo coverage reports
        continue-on-error: false
        run: |
          echo "=== Ejecutando tests unitarios y generando reportes de cobertura ==="
          mvn verify \
            --file backend/pom.xml \
            -B \
            -e \
            2>&1 | tee maven-output.log
          
          # Capturar el código de salida
          exit_code=${PIPESTATUS[0]}
          
          echo ""
          echo "=== Resumen de Ejecución ==="
          if [ $exit_code -eq 0 ]; then
            echo "✅ BUILD SUCCESS"
          else
            echo "❌ BUILD FAILED (Exit code: $exit_code)"
            echo ""
            echo "=== Últimas líneas del error ==="
            tail -50 maven-output.log | grep -E "FAILURE|ERROR|Failed to execute|Tests run:" || tail -30 maven-output.log
            echo ""
            echo "=== Causa identificada ==="
            
            if grep -q "There are test failures" maven-output.log; then
              echo "⚠️  CAUSA: Tests unitarios fallaron"
              echo ""
              echo "Tests que fallaron:"
              grep -A 5 "Failed tests:" maven-output.log || grep "Tests run:" maven-output.log | grep -v "Failures: 0"
            elif grep -q "Coverage checks have not been met" maven-output.log; then
              echo "⚠️  CAUSA: Cobertura de código menor al 80%"
            elif grep -q "Failed to execute goal.*maven-surefire-plugin" maven-output.log; then
              echo "⚠️  CAUSA: Error en ejecución de tests (Surefire plugin)"
              echo ""
              grep -B 2 -A 10 "Failed to execute goal.*maven-surefire-plugin" maven-output.log
              echo ""
              echo "=== Detalles de errores en surefire-reports ==="
              find backend -name "*.txt" -path "*/surefire-reports/*" -exec echo "Archivo: {}" \; -exec head -100 {} \; 2>/dev/null || echo "No se encontraron reportes detallados"
            else
              echo "⚠️  CAUSA: Error desconocido"
              echo ""
              echo "Contexto del error:"
              grep -B 10 "BUILD FAILURE" maven-output.log | tail -25
            fi
          fi
          
          exit $exit_code

      # 7. Verificar cobertura mínima (80%)
      - name: Check JaCoCo coverage threshold
        if: success() || failure()
        run: |
          echo "=== Verificando umbral de cobertura (80%) ==="
          
          # Contar tests ejecutados
          echo "=== Resumen de Tests ==="
          find backend -name "TEST-*.xml" -type f | wc -l | xargs echo "Archivos de test encontrados:"
          
          # Buscar archivos jacoco.exec
          echo ""
          echo "=== Reportes de Cobertura ==="
          find backend -name "jacoco.exec" -type f | while read file; do
            echo "✓ Encontrado: $file"
          done
          
          # Nota: La validación del umbral se realiza durante 'mvn verify'
          # Si la cobertura es menor al 80%, el build fallará automáticamente
          echo ""
          echo "✓ Verificación de cobertura completada (validación integrada en pom.xml)"

      # 8. Publicar resultados de tests
      - name: Publish test results
        if: success() || failure()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/target/surefire-reports/TEST-*.xml'
          check_name: Unit Test Results
          comment_mode: off

      # 9. Subir reportes de cobertura como artefactos
      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: |
            backend/*/target/site/jacoco/
            backend/*/target/jacoco.exec
          retention-days: 30

      # 10. Subir reportes de tests (incluyendo errores)
      - name: Upload test reports (surefire-reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: |
            backend/*/target/surefire-reports/
          retention-days: 15

      # OPCIONAL: Integración con SonarCloud
      # Descomenta las siguientes líneas si deseas usar SonarCloud para análisis de código
      #
      # - name: SonarCloud Scan
      #   uses: SonarSource/sonarcloud-github-action@master
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #   with:
      #     args: >
      #       -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
      #       -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
      #       -Dsonar.sources=backend
      #       -Dsonar.exclusions=backend/*/target/**,**/generated-sources/**
      #       -Dsonar.coverage.jacoco.xmlReportPaths=backend/*/target/site/jacoco/jacoco.xml

      # 10. Resumen del workflow
      - name: Print build summary
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "         BUILD SUMMARY"
          echo "=========================================="
          echo "Job Status: ${{ job.status }}"
          echo "Git Branch: ${{ github.ref }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "=========================================="
