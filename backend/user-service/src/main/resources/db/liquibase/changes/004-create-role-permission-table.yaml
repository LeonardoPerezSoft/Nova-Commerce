databaseChangeLog:
  - changeSet:
      id: create-role-permission-table-004
      author: auth-service
      objectQuotingStrategy: QUOTE_ALL_OBJECTS
      changes:
        - createTable:
            tableName: role_permission
            remarks: 'Tabla intermedia que relaciona roles con permisos'
            columns:
              - column:
                  name: role_id
                  type: uuid
                  remarks: 'Identificador del rol'
                  constraints:
                    nullable: false
                    foreignKeyName: fk_role_permission_role_id
                    references: roles(id)
              - column:
                  name: permission_id
                  type: uuid
                  remarks: 'Identificador del permiso'
                  constraints:
                    nullable: false
                    foreignKeyName: fk_role_permission_permission_id
                    references: permissions(id)
        - addPrimaryKey:
            tableName: role_permission
            columnNames: role_id, permission_id
            constraintName: pk_role_permission
        - createIndex:
            indexName: idx_role_permission_role_id
            tableName: role_permission
            columns:
              - column:
                  name: role_id
        - createIndex:
            indexName: idx_role_permission_permission_id
            tableName: role_permission
            columns:
              - column:
                  name: permission_id
